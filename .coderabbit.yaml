# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill # "assertive" for more nitpicks

  # CodeRabbit submits a *Request changes* review, so its check stays red until
  # findings are resolved.
  #
  # This was false, and PR #9 showed why that was the wrong default: two
  # Critical findings — a TOCTOU race that weakened the PIN lockout, and an
  # unguarded double-tap that could bind a device twice — sat under "All checks
  # have passed". With the workflow off, the check reports only whether the
  # review *ran*, never what it found, so the green tick carried no information
  # about severity. On a lending app that is the wrong trade.
  #
  # Merging is still the user's call: branch protection requires a PR but no
  # approvals, so a red CodeRabbit is a visible objection rather than a block.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!ios/**"
    - "!android/**"
    - "!**/*.lock"
    - "!assets/**"

  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        Expo SDK 57 / React Native app using Expo Router. Flag any use of
        web-only DOM APIs in shared code, missing platform guards, and
        deprecated Expo APIs. Prefer function components with hooks.
    - path: "**/*.tsx"
      instructions: >-
        Check accessibility props on touchables, and that styles avoid
        hardcoded colors where a theme token exists.

chat:
  auto_reply: true
