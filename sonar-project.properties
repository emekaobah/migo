sonar.projectKey=emekaobah_migo
sonar.organization=emekaobah

sonar.sources=src
sonar.tests=src/__tests__

# Coverage is only importable through CI-based analysis — Automatic Analysis
# cannot accept a report, which is why "Coverage on New Code" read 0.0% while
# the suite was green. See .github/workflows/ci.yml.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated or vendored — analysing these adds noise, not signal.
sonar.exclusions=ios/**,android/**,coverage/**,node_modules/**,assets/**,.expo/**

# The kitchen sink is a dev-only catalogue of every primitive in every state.
# It is deliberately long and repetitive, and it ships to nobody.
sonar.coverage.exclusions=src/app/(dev)/**,src/theme/**,src/__tests__/**
