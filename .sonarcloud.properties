# SonarQube Cloud — Automatic Analysis configuration.
#
# This file, not `sonar-project.properties`. Automatic Analysis ignores the
# latter outright; `.sonarcloud.properties` is the one it reads.

# `src/data/faq.ts` is generated from the design bundle's `faq-data.js` — 45
# question records with an identical shape. Sonar's copy-paste detector
# normalises string literals to a single token, so every `{ q: STRING, a:
# [STRING] }` block reads as a duplicate of the other 44 and the file alone put
# Duplication on New Code at 13.5% against a 3% gate.
#
# Excluded rather than reshaped, because reshaping would not help: a tuple
# encoding is equally token-identical once literals are normalised. The
# repetition is inherent to tabular data and says nothing about
# maintainability, which is what the metric exists to measure. Analysis still
# runs over the file — only duplication detection is skipped.
sonar.cpd.exclusions=src/data/faq.ts
