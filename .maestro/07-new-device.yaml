# Journey 7 — sign out → newdevice → authorise → new PIN → signed in.
#
# Signing out unbinds the phone, so this flow runs last: if it fails partway,
# everything after it would have to re-authorise. It sets the same PIN the
# sign-in helper uses, so a pass leaves the phone as it found it.
appId: com.emekaobah.migo
---
- launchApp
- runFlow: helpers/sign-in.yaml

- assertVisible: 'Your loan'
- tapOn: 'Account, .*'   # the account avatar in the header

- assertVisible: '.*account.*'
# Locking and signing out are deliberately separated — both must be present and
# distinct.
- assertVisible: 'Lock the app'
- tapOn: 'Sign out of this phone'

- assertVisible: 'Sign out of this phone?'
- assertVisible: '.*561.*9.*'
- tapOn:
    id: 'sign-out'

- extendedWaitUntil:
    visible: "We don't recognise this phone"
    timeout: 10000
- assertVisible: '*561*9#'
- tapOn:
    id: 'authorised'

# Sign-out cleared the PIN, so authorising leads to setting a new one — not to
# the lock screen, whose PIN pad would have nothing behind it.
- extendedWaitUntil:
    visible: 'Set a 6-digit backup PIN'
    timeout: 10000
# Same push-transition wait as 01-first-run.yaml: the first keypad tap can be
# lost without it.
- waitForAnimationToEnd
- repeat:
    times: 6
    commands:
      - tapOn: '1'
- tapOn:
    id: 'finish'

# The loan survived the sign-out — it is server-held.
- extendedWaitUntil:
    visible: 'Your loan'
    timeout: 10000
