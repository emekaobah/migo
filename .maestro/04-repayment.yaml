# Journey 4 — active → repay → wallet → detection → active.
#
# The detection window is six real seconds and there is deliberately no in-app
# trigger to short-circuit it (PLAN §5), so this flow waits it out. That wait is
# the honest depiction of a screen watching for a transfer.
appId: com.emekaobah.migo
---
- launchApp
- runFlow: helpers/sign-in.yaml

- assertVisible: 'Your loan'
- tapOn: 'Repay'

# ── repay ──────────────────────────────────────────────────────────────────
- assertVisible: 'Pay'
- assertVisible: '.*Remaining after this payment.*'
- tapOn: 'Sterling Bank'
# The wallet's waiting card has a spinner that never stops animating, so by
# default Maestro waits for the screen to settle until its timeout. On Android
# that wait outlasted the mock's 6-second payment window, and the card had
# already turned to "received" before the next step looked for it. A short
# settle timeout keeps the waiting state inside the window.
- tapOn:
    text: 'Get my wallet details'
    waitToSettleTimeoutMs: 500

# ── wallet ─────────────────────────────────────────────────────────────────
- assertVisible: 'Transfer to this account'
- assertVisible:
    id: 'payment-waiting'
# No demo shortcut may exist on this screen.
- assertNotVisible: ".*I've sent.*"

- extendedWaitUntil:
    visible:
      id: 'payment-received'
    timeout: 15000

# Settles, then returns on its own.
- extendedWaitUntil:
    visible: 'Your loan'
    timeout: 10000
# The payment must have been applied, not just navigated past: the instalment
# that was Next is now labelled Paid (the schedule row's accessible label).
- assertVisible: 'Payment 1, .*, Paid'
